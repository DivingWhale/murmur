[platformio]
default_envs = handheld
core_dir = ../work/pio

[env:handheld]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts =
    pre:tools/font_dependency.py
    pre:tools/campus_tls.py
    pre:tools/usb_dwc2.py
lib_deps =
    lvgl/lvgl@8.4.0
    MurmurDwc2=https://codeload.github.com/hathach/tinyusb/zip/86ad6e56c1700e85f1c5678607a762cfe3aa2f47
lib_ignore = TinyUSB
board_upload.flash_size = 16MB
board_upload.maximum_size = 7340032
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_SKIP
    -DLV_COLOR_16_SWAP=1
    -DLV_DISP_DEF_REFR_PERIOD=15
    -DLV_MEM_SIZE=98304
    -Wl,--wrap=eap_sm_allowMethod
    -Wl,--wrap=dcd_edpt_stall
monitor_speed = 115200
